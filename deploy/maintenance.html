<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="20">
  <title>Kuraka: mantenimiento</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; color: #25282d; background: #f3f4f5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: 100%; max-width: 520px; padding: 36px; border: 1px solid #dce0e4; border-radius: 12px; background: #fff; text-align: center; }
    h1 { margin: 0 0 24px; font-size: 1.5rem; }
    p { line-height: 1.6; }
    .mail { margin-top: 28px; color: #555d67; }
    @media (prefers-color-scheme: dark) {
      :root { color: #e6e8eb; background: #17191d; }
      main { background: #22252a; border-color: #3b4048; }
      .mail { color: #b4bbc5; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Kuraka: mantenimiento</h1>
    <p>Estamos actualizando Kuraka. Vuelve en unos minutos.</p>
    <p lang="en">Kuraka is being updated. Please check back in a few minutes.</p>
    <p class="mail">El correo sigue funcionando. / <span lang="en">Email keeps working.</span></p>
  </main>
</body>
</html>
