name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The upstream watcher (upstream.yml) runs CI on its patches/* branches
  # this way, because pushes made with GITHUB_TOKEN start no workflows.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/kuraka

  image:
    needs: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kuraka:ci
      - run: docker run --rm --entrypoint /usr/local/bin/kuraka kuraka:ci --version

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/ci/check-web.sh

  integration:
    needs: go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        stalwart: ["v1.0.2", "v1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/ci/stalwart-up.sh ${{ matrix.stalwart }}
      - run: go test -tags integration -count=1 ./internal/integration/...

  patches:
    uses: ./.github/workflows/patches.yml

  # Merges the watcher's pull request once every check passed on the commit
  # it pushed, then runs CI on main so the release workflow picks it up.
  automerge:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'patches/')
    needs: [go, image, web, integration, patches]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
    steps:
      - run: |
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$GITHUB_SHA"
          gh workflow run ci.yml --ref main

  automerge-failed:
    if: failure() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'patches/')
    needs: [go, image, web, integration, patches]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          gh pr comment "$BRANCH" --body "CI failed, so this stays open: $RUN_URL"
