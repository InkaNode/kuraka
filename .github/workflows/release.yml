name: Release

# Every push to main that passes CI republishes the release of the version in
# internal/version/version.go (tag v<version>), so a release always holds every
# commit since "chore: bump version to <version>". Images: <version>,
# <major>.<minor> and latest (stable versions only), plus sha-<commit>, which
# the panel's Kuraka update installs. patches.yml adds stalwart-webui.zip and
# the Libredesk image built from patches/.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    # workflow_dispatch: CI on main after the upstream watcher's merge (ci.yml automerge).
    if: github.event.workflow_run.conclusion == 'success' && contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - id: v
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n -E 's/^const Version = "([^"]+)"$/\1/p' internal/version/version.go)
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad version '$VERSION'"; exit 1; }
          IMAGE=ghcr.io/inkanode/kuraka
          TAGS="$IMAGE:$VERSION,$IMAGE:sha-$HEAD_SHA"
          PRERELEASE=false
          if [[ $VERSION == *-* ]]; then
            PRERELEASE=true
          else
            TAGS="$TAGS,$IMAGE:${VERSION%.*},$IMAGE:latest"
          fi
          { echo "version=$VERSION"; echo "tags=$TAGS"; echo "prerelease=$PRERELEASE"; } >> "$GITHUB_OUTPUT"

  image:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.tags }}
          build-args: KURAKA_COMMIT=${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.version=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  patches:
    needs: version
    uses: ./.github/workflows/patches.yml
    with:
      ref: ${{ github.event.workflow_run.head_sha }}
      publish: true
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, image, patches]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG=v$VERSION
          git log --format='%H%x09%s' "$HEAD_SHA" > log.tsv
          BUMP=$(awk -F '\t' -v s="chore: bump version to $VERSION" '$2 == s { print $1; exit }' log.tsv)
          if [[ -n $BUMP ]]; then
            BASE=$(git rev-parse --verify -q "$BUMP^" || true)
          else
            BASE=$(gh release list --exclude-drafts --limit 100 --json tagName --jq "[.[].tagName | select(. != \"$TAG\")][0] // empty")
            [[ -n $BASE ]] || { echo "no bump commit and no previous release; refusing to use the full history"; exit 1; }
          fi
          RANGE=$HEAD_SHA
          [[ -n $BASE ]] && RANGE=$BASE..$HEAD_SHA

          : > contributors
          {
            echo "## What's Changed"
            echo
            while read -r SHA; do
              LOGIN=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA" --jq '.author.login // empty' || true)
              SUBJECT=$(git log -1 --format=%s "$SHA")
              if [[ -n $LOGIN ]]; then
                echo "- $SUBJECT by @$LOGIN (${SHA:0:7})"
                echo "$LOGIN" >> contributors
              else
                echo "- $SUBJECT by $(git log -1 --format=%aN "$SHA") (${SHA:0:7})"
              fi
            done < <(git rev-list --reverse "$RANGE")
            if [[ -s contributors ]]; then
              echo
              echo "## Contributors"
              echo
              sort -fu contributors | sed 's/^/- @/'
            fi
            if [[ -n $BASE ]]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...$TAG"
            fi
          } > release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: stalwart-webui
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          TAG=v$VERSION
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --cleanup-tag --yes
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push -q origin ":refs/tags/$TAG"
          fi
          FLAGS=(--latest)
          [[ $PRERELEASE == true ]] && FLAGS=(--prerelease --latest=false)
          gh release create "$TAG" stalwart-webui.zip --title "$VERSION" --notes-file release-notes.md --target "$HEAD_SHA" "${FLAGS[@]}"
